name: Build CS16 iOS ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Baixar CS16Client
        run: |
          git clone --recursive https://github.com/Velaron/cs16-client.git cs16-client

      - name: Verificar Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Configurar build iOS ARM64
        run: |
          cd cs16-client
          cmake -S . -B build-ios \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DBUILD_CLIENT=ON \
            -DBUILD_SERVER=OFF \
            -DBUILD_MAINUI=OFF \
            -DENABLE_YY_THUNKS=OFF \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/output"

      - name: Compilar
        run: |
          cd cs16-client
          cmake --build build-ios --parallel 3

      - name: Instalar biblioteca
        run: |
          cd cs16-client
          cmake --install build-ios

      - name: Conferir biblioteca
        run: |
          find "$GITHUB_WORKSPACE/output" -type f -print
          find "$GITHUB_WORKSPACE/output" -name "*.dylib" -exec file {} \;

      - name: Compactar
        run: |
          cd "$GITHUB_WORKSPACE/output"
          zip -r "$GITHUB_WORKSPACE/client-ios-arm64.zip" .

      - name: Enviar resultado
        uses: actions/upload-artifact@v4
        with:
          name: client-ios-arm64
          path: client-ios-arm64.zip
