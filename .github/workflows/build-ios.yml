name: Build Xash iOS ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      SDL_VERSION: 2.32.10
      FFMPEG_VERSION: "9.0"
      YY_THUNKS_VERSION: v1.2.1
      GH_CPU_ARCH: arm64
      GH_CPU_OS: ios
      GH_CROSSCOMPILING: false

    steps:
      - name: Baixar Xash3D FWGS
        uses: actions/checkout@v6
        with:
          repository: FWGS/xash3d-fwgs
          submodules: recursive

      - name: Instalar dependências iOS
        run: |
          bash scripts/gha/deps_ios.sh

      - name: Compilar Xash3D para iOS ARM64
        env:
          FWGS_PFX_PASSWORD: ${{ secrets.FWGS_PFX_PASSWORD }}
        run: |
          bash scripts/gha/build_ios.sh

      - name: Verificar arquivos gerados
        run: |
          echo "=== ARTIFACTS ==="
          find artifacts -type f -print || true

          echo "=== BUILD ==="
          find build -type f \( -name "*.dylib" -o -name "*.framework" -o -name "*.a" \) -print || true

      - name: Compactar resultado
        run: |
          mkdir -p xash-ios-result

          if [ -d artifacts ]; then
            cp -R artifacts/. xash-ios-result/
          fi

          if [ -d build/ios ]; then
            mkdir -p xash-ios-result/build-ios
            cp -R build/ios/. xash-ios-result/build-ios/
          fi

          cd xash-ios-result
          zip -r "$GITHUB_WORKSPACE/xash-ios-arm64.zip" .

      - name: Enviar resultado
        uses: actions/upload-artifact@v7
        with:
          name: xash-ios-arm64
          path: xash-ios-arm64.zip
