name: Build Xash iOS ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Baixar Xash3D
        uses: actions/checkout@v6
        with:
          repository: FWGS/xash3d-fwgs
          submodules: recursive

      - name: Preparar dependencias
        run: |
          brew install python
          python3 --version

      - name: Baixar SDL2
        run: |
          git clone --depth 1 --branch SDL2 https://github.com/libsdl-org/SDL.git SDL2

      - name: Compilar SDL2 para iOS
        run: |
          cd SDL2/Xcode/SDL
          xcodebuild \
            -project SDL.xcodeproj \
            -scheme SDL \
            -sdk iphoneos \
            -configuration Release \
            -arch arm64 \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Configurar Xash para iOS ARM64
        run: |
          ./waf configure \
            --ios \
            --enable-bundled-deps \
            --sdl2="$GITHUB_WORKSPACE/SDL2/Xcode/SDL/build/Release-iphoneos/SDL2.framework"

      - name: Compilar Xash
        run: |
          ./waf build

      - name: Procurar bibliotecas
        run: |
          find build -type f \( -name "*.dylib" -o -name "*.a" \) -print

      - name: Compactar resultado
        run: |
          mkdir -p output
          cp -R build/ios/* output/ || true
          cd output
          zip -r "$GITHUB_WORKSPACE/xash-ios-arm64.zip" .

      - name: Enviar resultado
        uses: actions/upload-artifact@v4
        with:
          name: xash-ios-arm64
          path: xash-ios-arm64.zip
